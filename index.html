<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Route Calculator</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <header>
    <h1>Route Calculator</h1>
    <p>Введите координаты — получите отчёт по зонам (Минск / Минская обл.)</p>
  </header>

  <div class="grid">
    <div class="panel">
      <label for="input">Координаты<br><span class="hint">широта, долгота — по одной на строку</span></label>
      <textarea id="input" placeholder="30.10.2026 08:52:26&#9;0&#9;53.8776016&#9;27.64148&#10;..."></textarea>
    </div>
    <div class="panel">
      <label>Отчёт по зонам</label>
      <div class="result-box" id="result">
        <div class="placeholder">Здесь появится отчёт…</div>
      </div>
    </div>
  </div>

  <div class="actions">
    <button class="btn-primary" onclick="calculate()">🚀 Построить отчёт</button>
    <button class="btn-secondary" onclick="loadExample()">📋 Пример</button>
    <button class="btn-secondary" onclick="clearAll()">🗑️ Очистить</button>
  </div>

  <div class="error" id="error"></div>
</div>

<script src="example.js"></script>
<script src="script.js"></script>
</body>
</html>
